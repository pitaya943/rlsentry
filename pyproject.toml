[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlsentry"
version = "0.0.0"
description = "Attacker-perspective authorization verification for Supabase applications"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6,<3",
  "pyyaml>=6",
  "httpx>=0.27,<1",        # MS1 safety/http.py: the only HTTP client (ADR-012)
  "psycopg[binary]>=3.2,<4",  # MS4 whitebox/: read-only DB connection for splinter (ADR-032)
]                          # more are added by the milestone that first needs them (ADR-012)

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "ruff", "mypy", "mutmut", "types-PyYAML", "setuptools>=75"]

[tool.setuptools.packages.find]
# Flat layout: the repo root also holds lab/, harness/, logs/, host/, cloud/. Without this,
# setuptools' automatic discovery refuses to build ("Multiple top-level packages"). Only the
# product package is distributed (MS0 approval note #1, T-040).
include = ["rlsentry*"]

[tool.setuptools.package-data]
"rlsentry.whitebox" = ["*.sql"]   # vendored, hash-pinned splinter.sql (ADR-032)

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "safety: NFR-01..03 safety invariants",
  "e2e_profiles: end-to-end tests of the dev/ci/audit profiles",
]

[tool.ruff]
line-length = 110
extend-exclude = ["harness", "host", ".claude", "cloud"]   # frozen harness is not product code

[tool.ruff.lint.isort]
# Same import order in the main checkout and in subagent worktrees (.claude/worktrees/…).
known-first-party = ["rlsentry"]

[tool.mypy]
python_version = "3.12"
# Use the interpreter on PATH so mypy sees the project's dependencies even when mypy itself
# is installed in an isolated tool environment (uv/pipx). See ADR-012.
python_executable = "python3"
