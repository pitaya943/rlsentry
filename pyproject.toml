[project]
name = "rlsentry"
version = "0.0.0"
description = "Attacker-perspective authorization verification for Supabase applications"
requires-python = ">=3.12"
dependencies = []          # the architect adds product dependencies in MS0

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "ruff", "mypy", "mutmut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "safety: NFR-01..03 safety invariants",
  "e2e_profiles: end-to-end tests of the dev/ci/audit profiles",
]

[tool.ruff]
line-length = 110
# Frozen harness/host code and subagent worktrees are not lintable from this session (ADR-002).
extend-exclude = ["harness", "host", ".claude"]
