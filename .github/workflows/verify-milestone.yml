name: verify-milestone
on:
  workflow_dispatch:
    inputs:
      ms:
        description: "Milestone (e.g. MS1)"
        required: true
      ref:
        description: "Session branch to verify (e.g. claude/busy-darwin-asvox3)"
        required: true
permissions:
  contents: read            # read-only: this job can never push
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}   # the workflow itself always comes from main
          fetch-depth: 0
      - name: Show exact commit under test
        run: git log -1 --format='%H %s'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and dev dependencies
        run: pip install -e ".[dev]"
      - name: Install Supabase CLI
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin supabase
          supabase --version
          docker info --format '{{.ServerVersion}}'
      - name: make verify-milestone
        run: make verify-milestone MS=${{ inputs.ms }}
